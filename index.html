${items.map(it=>`- [${it.who} · ${it.where}] ${String(it.text).replace(/\s+/g," ").trim()}`).join("\n")}`}

function instrText(gid){const g=S.groups[gid];const K=kidsOf(gid);
  return `Tu m'aides à mettre au propre mes notes d'observation d'enfants de 0 à 5 ans en halte-garderie (groupe : ${g.name}). Je suis éducatrice spécialisée. Mes notes sont souvent dictées, en vrac, avec des prénoms mal écrits. Je te donne souvent toutes les notes d'une journée d'un coup : chaque ligne commence par [prénom · endroit], un simple indice.

À CHAQUE FOIS :
1. Réécris chaque note proprement, en gardant tous les faits et les mots des enfants. N'invente rien, n'interprète pas, reste positif et descriptif.
2. Reclasse chaque note au bon enfant (une note sur plusieurs enfants va à chacun), au bon domaine et, si c'est clair, au bon repère (code ci-dessous). Une note sur le groupe en entier va dans "groupe".
3. Si la note montre clairement un niveau pour un repère, indique-le : commence (avec beaucoup d'aide), envoie (avec un peu d'aide), acquis (seul). Sinon, laisse vide.
4. Si l'enfant a dit une phrase notée mot pour mot, mets-la dans "paroles", telle quelle.
   Note ce qui a aidé l'enfant (facilitateurs), avec les mots de la liste quand c'est possible : ${Object.values(FAC).flatMap(F=>F.L).join(", ")}.
5. Propose au besoin 1 à 3 mots-clés (force ou défi) et la sphère de la roue de la médecine : tete (comprendre, langage), esprit (liens, vie sociale), coeur (émotions, confiance), corps (bouger, sentir, soins).
6. Réponds seulement avec le bloc ci-dessous, sans autre texte.

=== BLOC AWACAK ===
{"date":"AAAA-MM-JJ","groupe":[{"texte":"…"}],"extraits":[{"enfant":"Prénom","domaine":"phys|cog|lang|soc","repere":"code ou vide","niveau":"commence|envoie|acquis ou vide","moment":"A|J|C|H|D|R|T|S|P ou vide","texte":"…","motscles":[{"mot":"1 à 3 mots","sphere":"tete|esprit|coeur|corps","type":"force|defi"}],"facilitateurs":["ce qui a aidé"],"paroles":["phrase dite par l'enfant, mot pour mot"],"prochainpas":"idée d'un prochain pas, ou vide","fil":{"code":"code du fil ou vide","interet":"pasencore|interesse|adore ou vide","utile":"oui si l'enfant le fait de lui-même, sans qu'on lui demande, sinon vide","materiaux":["matériau ou contexte nommé dans la note"]}}]}
=== FIN BLOC ===

Moments : ${Object.entries(MOM).map(([k,n])=>k+" = "+n).join(", ")}.

FILS DE PROGRESSION (si la note parle de l'intérêt de l'enfant pour une habileté ou de son utilisation ailleurs, remplis "fil" ; sinon laisse "fil" vide) :
${FILS.map(f=>`[${f.id}] ${f.nom} : étapes ${f.steps.join(", ")}`).join("\n")}

ENFANTS DU GROUPE (écris le prénom exactement ainsi) :
${K.map(c=>`- ${c.name}${c.dob?" ("+ageLabel(c.dob)+")":""}`).join("\n")||"(aucun)"}

REPÈRES (code = repère) :
${Object.entries(SUBS).map(([sk,s])=>`${DOMS[s.dom].nom} · ${s.nom}\n`+BANDS.map((bn,b)=>`  ${bn} : `+REP.filter(r=>r.sub===sk&&r.band===b).map(r=>`[${r.id}] ${r.t}`).join(" ; ")).join("\n")).join("\n")}`}
function parseBlocs(txt){const out=[];const re=/===\s*BLOC[^=]*===([\s\S]*?)===\s*FIN BLOC\s*===/g;let m;while((m=re.exec(txt))){try{out.push(JSON.parse(m[1].trim()))}catch(e){}}
  if(!out.length){const t=txt.trim();const i=t.indexOf("{"),j=t.lastIndexOf("}");if(i>=0&&j>i){try{const o=JSON.parse(t.slice(i,j+1));(Array.isArray(o)?o:[o]).forEach(x=>out.push(x))}catch(e){}}}
  return out.filter(b=>b&&(Array.isArray(b.extraits)||Array.isArray(b.groupe)))}
function findKid(gid,name){const n=norm(name);const K=kidsOf(gid);return K.find(c=>norm(c.name)===n)||K.find(c=>norm(c.name).startsWith(n)||n.startsWith(norm(c.name)))||K.find(c=>norm(c.name).split(" ")[0]===n.split(" ")[0])}

      const NV={commence:1,envoie:2,"en voie":2,acquis:3};

      <div class="row" style="margin-top:10px"><button class="btn primary" id="iOk">Enregistrer</button></div>`;
      s.querySelector("#iOk").onclick=()=>{const on=[...s.querySelectorAll(".iK:checked")].map(x=>items[+x.value]);let n=0;const dates=new Set();
        on.forEach(it=>{dates.add(it.date);if(it.type==="g"){(g.notes=g.notes||[]).push({id:uid("gn"),date:it.date,text:it.texte,src:"ia"});n++;return}const c=it.c,x=it.x;const rid=x.repere&&REPI[x.repere]?x.repere:"";
          (c.notes=c.notes||[]).push({id:uid("n"),date:it.date,text:x.texte,rep:rid,dom:rid?REPI[rid].dom:(DOMS[x.domaine]?x.domaine:""),moment:MOM[x.moment]?x.moment:"",src:"ia"});n++;
          const lv=NV[x.niveau];if(rid&&lv)setLvl(c,rid,lv,it.date);
          (x.motscles||[]).forEach(k=>{if(k&&k.mot&&SPH[k.sphere])(c.kw=c.kw||[]).push({id:uid("k"),mot:k.mot,sph:k.sphere,t:k.type==="defi"?"defi":"force",date:it.date})});
          (x.paroles||[]).forEach(t=>{if(t&&typeof t==="string")(c.mots=c.mots||[]).push({id:uid("m"),date:it.date,text:t.replace(/^[«"]\s*|\s*[»"]$/g,"")})});
          (x.facilitateurs||[]).forEach(l=>{if(l&&typeof l==="string")(c.fac=c.fac||[]).push({id:uid("f"),label:l.charAt(0).toUpperCase()+l.slice(1),fam:famOf(l),date:it.date,rep:rid})});
          const xf=x.fil&&FILI[x.fil.code]?x.fil:null;if(xf){const d=filOf(c,xf.code);const IV={pasencore:0,"pas encore":0,interesse:1,"intéresse":1,intrigue:1,adore:2,allume:2};if(IV[xf.interet]!=null){d.int=IV[xf.interet];d.intD=it.date}if(/^oui/i.test(xf.utile||"")){d.besoin=true;d.besD=it.date}(xf.materiaux||[]).forEach(m=>{if(m&&typeof m==="string"){m=cap1(m);d.mat=d.mat||[];if(!d.mat.some(y=>norm(y)===norm(m)))d.mat.push(m)}})}
          if(x.prochainpas&&!(c.pas||[]).some(p=>norm(p.text)===norm(x.prochainpas)))(c.pas=c.pas||[]).push({id:uid("p"),text:x.prochainpas,rep:rid,status:"cours",date:it.date})});
        if(pe&&dates.has(pe.date))removeExported(gid);

/* ---------- Portrait périodique ---------- */
function periodLabel(){const d=new Date();const m=d.getMonth()+1,y=d.getFullYear();return m>=6?`novembre ${y}`:`mai ${y}`}
function portraitData(c){const out={};Object.entries(DOMS).forEach(([dk,D])=>{const obs=REP.filter(r=>r.dom===dk&&!r.fil&&lvlOf(c,r.id)).map(r=>`${r.t} : ${LV[lvlOf(c,r.id)].toLowerCase()}`);const fils=FILS.filter(f=>SUBS[f.sub].dom===dk&&filUsed(c,f)).map(f=>filPhrase(c,f));const notes=(c.notes||[]).filter(n=>n.dom===dk).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25).map(n=>`${n.date} : ${n.text}`);out[dk]={obs,notes,fils}});return out}
function portraitPrompt(c,per){const P=portraitData(c);const A=kwAgg(c);
  return `Rédige le portrait périodique (dossier éducatif, ministère de la Famille du Québec) de ${c.name}${c.dob?", "+ageLabel(c.dob):""}, pour la période de ${per}. Il couvre les 4 domaines : physique et moteur, cognitif, langagier, social et affectif.
Pour chaque domaine : 3 à 5 phrases simples pour les parents, positives, descriptives et respectueuses, qui soulignent les forces, les intérêts, les progrès et, s'il y a lieu, les défis présentés comme ce sur quoi on travaille. Pas de jargon, pas de diagnostic, rien d'inventé : utilise seulement les observations ci-dessous. Ajoute "aide" : 1 ou 2 phrases sur ce qui l'aide (à partir des facilitateurs ci-dessous). Ajoute "suite" : 2 ou 3 prochains pas que nous allons offrir.
Pour les progressions, suis cet ordre : son intérêt, ce qu'il fait maintenant, puis où il l'utilise (ex. « Léa adore les ciseaux ; elle coupe maintenant sur une ligne droite et s'en sert quand elle en a besoin, autant pour le papier que pour la pâte à modeler. »).

function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type||"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

  else if(a==="lv"){const l=+b.dataset.l;const now=lvlOn(c,b.dataset.r,U.date);setLvl(c,b.dataset.r,now===l?0:l,U.date);save();render()}
  else if(a==="noteRep")noteSheet(id,b.dataset.r,!!b.dataset.dict);else if(a==="noteAdd")noteSheet(id,"");
  else if(a==="noteDel"){c.notes=c.notes.filter(n=>n.id!==b.dataset.n);save();render()}
  else if(a==="pasFromRep"){const r=REPI[b.dataset.r];const t="Offrir : "+r.a.split(",")[0].trim().replace(/^./,x=>x.toLowerCase());(c.pas=c.pas||[]).push({id:uid("p"),text:t,rep:r.id,status:"cours",date:U.date});save();toast("Prochain pas ajouté (modifiable dans le Portrait)");render()}
  else if(a==="pasAdd"){const t=$("#pasT").value.trim();if(!t)return;(c.pas=c.pas||[]).push({id:uid("p"),text:t,rep:"",status:"cours",date:U.date});save();render()}
  else if(a==="pasSug"){(c.pas=c.pas||[]).push({id:uid("p"),text:b.dataset.t,rep:b.dataset.r||"",status:"cours",date:U.date});save();render()}
  else if(a==="pasSt"){const p=c.pas.find(x=>x.id===b.dataset.p);p.status=p.status==="fait"?"cours":"fait";p.doneDate=p.status==="fait"?U.date:"";save();render()}
  else if(a==="pasDel"){c.pas=c.pas.filter(x=>x.id!==b.dataset.p);save();render()}else if(a==="pasNote")pasNoteSheet(id,b.dataset.p);
  else if(a==="kwAdd"){const m=$("#kwM").value.trim();if(!m)return;(c.kw=c.kw||[]).push({id:uid("k"),mot:m,sph:$("#kwS").value,t:$("#kwT").value,date:U.date});save();render()}
  else if(a==="kwOpen")kwSheet(id,b.dataset.m,b.dataset.s,b.dataset.t);
  else if(a==="photoView")photoViewSheet(id,b.dataset.p);
  else if(a==="portraitP")portraitSheet(id);
  else if(a==="piste"){pisteCycle(c,b.dataset.l,b.dataset.r||"");save();if(!$("#ov").classList.contains("on"))render()}
  else if(a==="bank")bankSheet(id,b.dataset.k,b.dataset.r);
  else if(a==="motAdd")motSheet(id);else if(a==="motDel"){c.mots=(c.mots||[]).filter(m=>m.id!==b.dataset.m);save();render()}
  else if(a==="facAdd")facSheet(id,"");else if(a==="facFromRep")facSheet(id,b.dataset.r);else if(a==="facOpen")facOpenSheet(id,b.dataset.l);
  else if(a==="eclairs")eclairSheet(id);else if(a==="album")albumSheet(id);
  else if(a==="notesMenu")notesMenu(id);else if(a==="qSort")qSortSheet(id,b.dataset.q);
  else if(a==="qDel"){const g=S.groups[id];g.inbox=g.inbox.filter(x=>x.id!==b.dataset.q);save();render()}
  else if(a==="backup")backup();else if(a==="backupPh")backupPhotos()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="uDate"){U.date=t.value||todayISO();render()}
  else if(t.dataset.act==="photoAdd"&&t.files[0])addPhoto(t.dataset.id,t.files[0],t.dataset.r||"");
  else if(t.dataset.act==="mergeFile"&&t.files[0])onBackupFile(t.files[0],"merge");
  else if(t.dataset.act==="restoreFile"&&t.files[0]){if(confirm("Remplacer toutes les données de cet appareil par cette sauvegarde ?"))onBackupFile(t.files[0],"restore")}
  else if(t.id==="setMe"){S.settings.me=t.value.trim();save()}else if(t.id==="setAI"){S.settings.ai=t.value;save()}
  else if(t.dataset.sphr){S.settings.sph=S.settings.sph||{};const r=REPI[t.dataset.sphr];if(t.value===r.sph0)delete S.settings.sph[r.id];else S.settings.sph[r.id]=t.value;save();toast("Sphère modifiée")}});
$("#fab").onclick=()=>{const r=route();const g=r.v==="group"?r.gid:r.v==="child"&&S.children[r.cid]?S.children[r.cid].groupId:null;if(g)quickNote(g,r.v==="child"?r.cid:null)};
/* ---------- Démarrage ---------- */
(async()=>{try{db=await idb();const st=await getP("state","main");if(st)S=Object.assign(S,st);S.settings=Object.assign({me:"",ai:"claude",sph:{}},S.settings||{})}catch(e){toast("Stockage indisponible sur ce navigateur.")}
  render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
