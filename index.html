<style>
:root{--or:#E0782F;--or2:#F6D2B4;--or3:#FDF1E6;--ink:#2a2622;--mut:#7a716a;--line:#EADFD3;--bg:#FFFBF6;--ok:#4E8A5C;--y:#F2C335;--red:#C9573F;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:30;background:var(--or);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
header.top a{color:#fff;text-decoration:none}header.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}header.top .brand img{width:30px;height:30px;border-radius:8px;background:#fff2}
header.top .sp{flex:1}header.top .ic{font-size:1.25rem;padding:4px 6px}
main{max-width:860px;margin:0 auto;padding:12px 14px 110px}
h2{font-size:1.35rem;margin:6px 0 10px}h3{font-size:1.1rem;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px}
.btn.primary{background:var(--or);border-color:var(--or);color:#fff}.btn.small{padding:5px 12px;min-height:34px;font-size:.88rem}.btn.ghost{border-color:transparent;background:transparent}.btn.danger{color:var(--red);border-color:#f0c9bf}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}textarea.field{min-height:90px;resize:vertical}
label.f{display:block;margin:8px 0;font-weight:600;font-size:.9rem}label.f .field{margin-top:4px;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink)}.chip.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;text-decoration:none;color:var(--ink);display:block}.kid img{width:64px;height:64px;object-fit:contain}.kid b{display:block;font-size:1.02rem}.kid .tiny{display:block}
.pres{display:flex;gap:8px;flex-wrap:wrap}.pk{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;display:flex;align-items:center;gap:5px;font:inherit;font-size:.86rem;cursor:pointer}.pk img{width:28px;height:28px}.pk.on{border-color:var(--ok);background:#E7F2E6;font-weight:600}
.avatar{width:72px;height:72px;object-fit:contain}
.head{display:flex;gap:12px;align-items:center}.head .nm{font-size:1.4rem;font-weight:700;line-height:1.2}
.rep{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff}
.rep .rt{font-weight:600;line-height:1.35}.mom{display:inline-block;font-size:.72rem;font-weight:600;color:#8a5a2b;background:var(--or3);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.lv{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 4px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
.lv.l1.on{background:#FFF1C9;border-color:var(--y);color:#7a5a00}.lv.l2.on{background:#FBE0CB;border-color:var(--or);color:#8a3f0b}.lv.l3.on{background:#E2F0E0;border-color:var(--ok);color:#2f5e3a}
.rep details{margin-top:6px}.rep summary{cursor:pointer;font-size:.82rem;color:var(--mut)}.aide{font-size:.86rem;margin:6px 0}
.hist{font-size:.78rem;color:var(--mut);margin-top:4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
.d1{background:var(--y)}.d2{background:var(--or)}.d3{background:var(--ok)}
.bandbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.entry{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}.entry:first-child{border-top:0}.entry .when{font-size:.76rem;color:var(--mut);white-space:nowrap;min-width:52px;padding-top:2px}.entry .txt{flex:1;font-size:.92rem}.entry .where{display:block;font-size:.74rem;color:#8a5a2b}
.x{border:0;background:none;color:var(--mut);font-size:1rem;cursor:pointer;padding:2px 6px}
.pas{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:#fff}.pas .st{flex:none;border:0;border-radius:999px;padding:5px 10px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
.st.cours{background:#FFF1C9;color:#7a5a00}.st.fait{background:#E2F0E0;color:#2f5e3a}.pas .tx{flex:1}.pas .tx b{display:block}.pas .tx .tiny{color:var(--mut)}
.sug{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1.5px dashed var(--or2);background:var(--or3);border-radius:12px;padding:7px 10px;margin:5px 0;font:inherit;font-size:.86rem;cursor:pointer;width:100%;color:var(--ink)}.sug small{color:var(--mut);font-size:.74rem}
.wheelwrap{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:6px auto}.wheelwrap svg{position:absolute;inset:0;width:100%;height:100%}
.q{position:absolute;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;overflow:hidden}
.qn{left:22%;right:22%;top:6%;height:24%}.qs{left:22%;right:22%;bottom:6%;height:24%}.qe{right:4%;top:30%;width:24%;height:40%}.qw{left:4%;top:30%;width:24%;height:40%}
.k{background:rgba(255,255,255,.94);border:0;border-radius:999px;padding:2px 8px;font:inherit;font-weight:700;color:#2a2622;cursor:pointer;line-height:1.2}.k.defi{outline:2px dashed #C9573F;outline-offset:-2px}
.wc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;text-align:center;font-weight:700;font-size:.85rem;line-height:1.15}
.wi{position:absolute;width:9%;z-index:2}.wi.n{left:50%;top:30.5%;transform:translateX(-50%)}.wi.s{left:50%;bottom:30.5%;transform:translateX(-50%)}.wi.e{right:30.5%;top:50%;transform:translateY(-50%)}.wi.w{left:30.5%;top:50%;transform:translateY(-50%)}
.leg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.74rem;margin-top:6px}.leg img{width:34px;height:34px}.leg b{display:block;font-size:.82rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:#eee;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:cover}
.notice{background:var(--or3);border:1px solid var(--or2);border-radius:12px;padding:10px 12px;font-size:.9rem;margin:8px 0}
.inbox{border-left:5px solid var(--y)}
.cnt{display:inline-block;background:var(--or);color:#fff;border-radius:999px;font-size:.75rem;font-weight:700;padding:1px 8px;margin-left:4px}
details.sec>summary{cursor:pointer;list-style:none;font-weight:700;font-size:1.05rem}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::before{content:"▸ ";color:var(--or)}details.sec[open]>summary::before{content:"▾ "}
#ov{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.45);display:none;align-items:flex-end;justify-content:center}#ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1.2rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#2a2622;color:#fff;border-radius:999px;padding:9px 16px;font-size:.9rem;display:none;max-width:90vw;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:6px;border:1.5px solid #C99A1E;border-radius:999px;padding:12px 16px;background:var(--y);color:#2a2622;font:inherit;font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.mic{display:inline-flex;align-items:center;gap:4px}.mic.rec{background:#C9573F;color:#fff;border-color:#C9573F}
.list{max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 10px;background:#fff}.li{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}.li:last-child{border-bottom:0}
.empty{text-align:center;padding:20px 10px;color:var(--mut)}
.hero{text-align:center;padding:10px 0}.hero img{width:150px}
@media(min-width:700px){.lvls{max-width:420px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#accueil"><img src="img/icon-192.png" alt="">Awacak</a><span class="sp"></span><a class="ic" href="#parametres" aria-label="Paramètres">⚙︎</a></header>
<main id="main"></main>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<button class="fab" id="fab" style="display:none" aria-label="Note rapide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Note rapide</button>
<script src="reperes.js"></script>
<script>
"use strict";
/* ---------- Référentiel ---------- */
const SUBS={mg:{dom:"phys",nom:"Motricité globale"},mf:{dom:"phys",nom:"Motricité fine"},sp:{dom:"phys",nom:"Soins personnels"},se:{dom:"phys",nom:"Sensoriel"},co:{dom:"cog",nom:"Cognitif"},la:{dom:"lang",nom:"Langagier"},so:{dom:"soc",nom:"Social et affectif"}};
const DOMS={phys:{nom:"Physique et moteur",court:"Physique",subs:["mg","mf","sp","se"],sph:"corps"},cog:{nom:"Cognitif",court:"Cognitif",subs:["co"],sph:"tete"},lang:{nom:"Langagier",court:"Langagier",subs:["la"],sph:"tete"},soc:{nom:"Social et affectif",court:"Social",subs:["so"],sph:"coeur"}};
const BANDS=["0-12 mois","1-2 ans","2-3 ans","3-4 ans","4-5 ans"];
const MOM={A:"Arrivée",J:"Jeu libre",C:"Collation",H:"Habillage",D:"Dehors",R:"Cercle",T:"Transitions",S:"Soins",P:"Départ"};
const SPH={tete:{nom:"Tête",d:"comprendre, langage",col:"#F7F4EC"},esprit:{nom:"Esprit",d:"liens, vie sociale",col:"#F2C335"},coeur:{nom:"Cœur",d:"émotions, confiance",col:"#D63B3F"},corps:{nom:"Corps",d:"bouger, sentir, soins",col:"#2E2E2E"}};
const LV={1:"Commence",2:"En voie",3:"Acquis"};
const AVATARS=["renard","castor","ours","lievre","hibou","loup","cerf","raton","herisson","ecureuil"];
const AIS={claude:{nom:"Claude",url:"https://claude.ai/new"},chatgpt:{nom:"ChatGPT",url:"https://chatgpt.com/"},gemini:{nom:"Gemini",url:"https://gemini.google.com/app"}};
const REP=[];const REPI={};
(()=>{const cnt={};REP_RAW.forEach(([sub,b,t,m,a,sph])=>{const k=sub+b;cnt[k]=(cnt[k]||0)+1;const id=sub+b+"-"+cnt[k];const r={id,sub,dom:SUBS[sub].dom,band:b,t,m,a,sph0:sph||DOMS[SUBS[sub].dom].sph};REP.push(r);REPI[id]=r})})();
/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];const MOISL=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtD=(d,long)=>{if(!d)return "";const [y,m,j]=d.split("-").map(Number);return long?`${j} ${MOISL[m-1]} ${y}`:`${j} ${MOIS[m-1]}`};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function ageMonths(dob,at){if(!dob)return null;const a=new Date(dob+"T12:00"),b=new Date((at||todayISO())+"T12:00");let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());if(b.getDate()<a.getDate())m--;return m}
function ageLabel(dob){const m=ageMonths(dob);if(m==null)return "";if(m<24)return m+" mois";const y=Math.floor(m/12),r=m%12;return y+" an"+(y>1?"s":"")+(r?" "+r+" mois":"")}
function bandOf(c){const m=ageMonths(c.dob);if(m==null)return c.band!=null?c.band:2;return m<12?0:m<24?1:m<36?2:m<48?3:4}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function img(n){return "img/"+n+".png"}
function sphOf(r){return (S.settings.sph||{})[r.id]||r.sph0}
/* ---------- Stockage (IndexedDB, nom propre à Awacak) ---------- */
const DBN="awacak-db";let db=null;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open(DBN,1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("state"))d.createObjectStore("state");if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos")};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const st=t.objectStore(store);const r=fn(st);t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);t.onerror=()=>rej(t.error)})}
function getP(store,key){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function keysP(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let S={v:1,groups:{},children:{},settings:{me:"",ai:"claude",sph:{}},meta:{}};
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>tx("state","readwrite",st=>st.put(JSON.parse(JSON.stringify(S)),"main")).catch(e=>toast("Erreur d'enregistrement")),150)}
const U={date:todayISO(),sub:{},band:{},allBands:{}};
const photoURL={};async function phSrc(id){if(photoURL[id])return photoURL[id];const b=await getP("photos",id);if(!b)return "";photoURL[id]=URL.createObjectURL(b);return photoURL[id]}
function hydrateThumbs(){document.querySelectorAll("img[data-ph]").forEach(async im=>{if(im.src&&!im.src.endsWith("#"))return;im.src=await phSrc(im.dataset.ph)})}
/* ---------- Données ---------- */
const kidsOf=gid=>Object.values(S.children).filter(c=>c.groupId===gid).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
function lvlOf(c,rid){const L=(c.obs||{})[rid]||[];if(!L.length)return 0;return L.slice().sort((a,b)=>a.d.localeCompare(b.d)).pop().l}
function lvlOn(c,rid,d){const e=((c.obs||{})[rid]||[]).find(x=>x.d===d);return e?e.l:0}
function setLvl(c,rid,l,d){c.obs=c.obs||{};const L=c.obs[rid]=(c.obs[rid]||[]).filter(x=>x.d!==d);if(l)L.push({d,l});if(!L.length)delete c.obs[rid]}
function kwAgg(c){const m={};(c.kw||[]).forEach(k=>{const key=norm(k.mot)+"|"+k.sph+"|"+k.t;const e=m[key]=m[key]||{mot:k.mot,sph:k.sph,t:k.t,n:0,last:"",ids:[]};e.n++;e.ids.push(k.id);if((k.date||"")>e.last)e.last=k.date||""});return Object.values(m)}
function repLabel(rid){const r=REPI[rid];return r?r.t:""}
function presOf(g,d){return (g.presences||{})[d]||[]}
/* ---------- Rendu ---------- */
function route(){const h=location.hash.slice(1)||"accueil";if(h.startsWith("g-"))return {v:"group",gid:h.slice(2)};if(h.startsWith("e-")){const [cid,tab]=h.slice(2).split("--");return {v:"child",cid,tab:tab||"portrait"}}if(h==="parametres")return {v:"settings"};return {v:"home"}}
function render(){const r=route();let h="";
  if(r.v==="group"&&S.groups[r.gid])h=viewGroup(r.gid);else if(r.v==="child"&&S.children[r.cid])h=viewChild(r.cid,r.tab);else if(r.v==="settings")h=viewSettings();else h=viewHome();
  $("#main").innerHTML=h;hydrateThumbs();
  const g=r.v==="group"?r.gid:r.v==="child"&&S.children[r.cid]?S.children[r.cid].groupId:null;$("#fab").style.display=g?"":"none"}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
function viewHome(){const G=Object.values(S.groups);
  let h=`<div class="hero"><img src="img/enfants.png" alt=""><h2 style="margin:4px 0 0">Awacak</h2><p class="muted small" style="margin:2px 0 0">Observer les enfants de 0 à 5 ans dans leur quotidien</p></div>`;
  h+=`<section class="card"><h3>Mes groupes</h3>${G.length?`<div class="kids">${G.map(g=>`<a class="kid" href="#g-${g.id}"><img src="img/enfants.png" alt=""><b>${esc(g.name)}</b><span class="tiny muted">${kidsOf(g.id).length} enfant(s)</span></a>`).join("")}</div>`:`<p class="muted">Aucun groupe pour l'instant.</p>`}
  <div class="row" style="margin-top:10px"><input class="field" id="newG" placeholder="Nom du groupe (ex. : Halte du matin)" style="flex:1 1 200px"><button class="btn primary" data-act="addGroup">Créer</button></div></section>`;
  const lb=S.meta.lastBackup;
  h+=`<section class="card"><details class="sec" ${G.length?"":"open"}><summary>Sauvegarde <span class="muted small" style="font-weight:400">${lb?"dernière : "+fmtD(lb.slice(0,10)):"aucune encore"}</span></summary>
  <p class="small muted">Les données restent sur cet appareil. Faites une sauvegarde régulièrement, et pour échanger avec une collègue.</p>
  <div class="row"><button class="btn small primary" data-act="backup">Sauvegarde texte</button><button class="btn small" data-act="backupPh">Sauvegarde des photos</button></div>
  <div class="row" style="margin-top:8px"><label class="btn small">Fusionner une sauvegarde<input type="file" accept=".json,application/json" hidden data-act="mergeFile"></label><label class="btn small danger">Restaurer (remplacer tout)<input type="file" accept=".json,application/json" hidden data-act="restoreFile"></label></div></details></section>`;
  return h}
function viewGroup(gid){const g=S.groups[gid];const K=kidsOf(gid);const pr=presOf(g,U.date);
  let h=`<div class="row sb"><h2 style="margin:0">${esc(g.name)}</h2><button class="btn small ghost" data-act="groupEdit" data-id="${gid}">Réglages</button></div>
  <label class="f" style="max-width:220px">Date<input type="date" class="field" id="uDate" value="${U.date}"></label>`;

/* ---------- Notes : exporter → IA → importer ---------- */

function dayItems(gid,d){const out=[];kidsOf(gid).forEach(c=>(c.notes||[]).filter(n=>n.date===d).forEach(n=>out.push({kind:"n",cid:c.id,id:n.id,who:c.name,where:[n.rep?repLabel(n.rep):n.dom?DOMS[n.dom].nom:"",n.moment?MOM[n.moment]:""].filter(Boolean).join(" · ")||"Note",text:n.text})));

function exportPrompt(gid,d,items){return `Voici TOUTES mes notes du ${fmtD(d,true)} (groupe ${S.groups[gid].name}), prises à différents endroits de l'app Awacak, souvent dictées en vrac.

Réécris-les proprement (ponctuation, phrases claires, sans hésitations, en gardant tous les faits et les mots des enfants), puis reclasse chacune au bon enfant, au bon domaine et au bon repère selon tes instructions Awacak. Redonne-moi seulement le bloc Awacak complet. Chaque note doit s'y retrouver. Date : ${d}.

${items.map(it=>`- [${it.who} · ${it.where}] ${String(it.text).replace(/\s+/g," ").trim()}`).join("\n")}`}
function exportSheet(gid,d){const items=dayItems(gid,d);

  ${items.length?`<div class="list">${items.map((it,i)=>`<label class="li"><input type="checkbox" class="xK" value="${i}" checked><span><b>${esc(it.who)}</b> <span class="muted">· ${esc(it.where)}</span><br>${esc(String(it.text).slice(0,140))}</span></label>`).join("")}</div>`:`<p class="muted small">Aucune note à cette date.</p>`}
  <ol class="small muted" style="padding-left:20px"><li><b>Copier</b>, puis coller dans votre projet ${esc(AIS[S.settings.ai||"claude"].nom)} (celui qui a les instructions Awacak).</li><li>L'IA réécrit, reclasse et redonne un bloc Awacak.</li><li><b>Importer la réponse</b> : les notes brutes de cette date sont remplacées par les notes propres. Les originales restent gardées.</li></ol>
  <div class="row"><button class="btn primary" id="xC" ${items.length?"":"disabled"}>1. Copier pour mon IA</button><button class="btn" id="xI">3. Importer la réponse</button><button class="btn ghost" id="xN">Fermer</button></div>`,s=>{

function instrText(gid){const g=S.groups[gid];const K=kidsOf(gid);
  return `Tu m'aides à mettre au propre mes notes d'observation d'enfants de 0 à 5 ans en halte-garderie (groupe : ${g.name}). Je suis éducatrice spécialisée. Mes notes sont souvent dictées, en vrac, avec des prénoms mal écrits. Je te donne souvent toutes les notes d'une journée d'un coup : chaque ligne commence par [prénom · endroit], un simple indice.

À CHAQUE FOIS :
1. Réécris chaque note proprement, en gardant tous les faits et les mots des enfants. N'invente rien, n'interprète pas, reste positif et descriptif.
2. Reclasse chaque note au bon enfant (une note sur plusieurs enfants va à chacun), au bon domaine et, si c'est clair, au bon repère (code ci-dessous). Une note sur le groupe en entier va dans "groupe".
3. Si la note montre clairement un niveau pour un repère, indique-le : commence (avec beaucoup d'aide), envoie (avec un peu d'aide), acquis (seul). Sinon, laisse vide.
4. Propose au besoin 1 à 3 mots-clés (force ou défi) et la sphère de la roue de la médecine : tete (comprendre, langage), esprit (liens, vie sociale), coeur (émotions, confiance), corps (bouger, sentir, soins).
5. Réponds seulement avec le bloc ci-dessous, sans autre texte.

=== BLOC AWACAK ===
{"date":"AAAA-MM-JJ","groupe":[{"texte":"…"}],"extraits":[{"enfant":"Prénom","domaine":"phys|cog|lang|soc","repere":"code ou vide","niveau":"commence|envoie|acquis ou vide","moment":"A|J|C|H|D|R|T|S|P ou vide","texte":"…","motscles":[{"mot":"1 à 3 mots","sphere":"tete|esprit|coeur|corps","type":"force|defi"}],"prochainpas":"idée d'un prochain pas, ou vide"}]}
=== FIN BLOC ===

Moments : ${Object.entries(MOM).map(([k,n])=>k+" = "+n).join(", ")}.

ENFANTS DU GROUPE (écris le prénom exactement ainsi) :
${K.map(c=>`- ${c.name}${c.dob?" ("+ageLabel(c.dob)+")":""}`).join("\n")||"(aucun)"}

REPÈRES (code = repère) :
${Object.entries(SUBS).map(([sk,s])=>`${DOMS[s.dom].nom} · ${s.nom}\n`+BANDS.map((bn,b)=>`  ${bn} : `+REP.filter(r=>r.sub===sk&&r.band===b).map(r=>`[${r.id}] ${r.t}`).join(" ; ")).join("\n")).join("\n")}`}
function parseBlocs(txt){const out=[];const re=/===\s*BLOC[^=]*===([\s\S]*?)===\s*FIN BLOC\s*===/g;let m;while((m=re.exec(txt))){try{out.push(JSON.parse(m[1].trim()))}catch(e){}}
  if(!out.length){const t=txt.trim();const i=t.indexOf("{"),j=t.lastIndexOf("}");if(i>=0&&j>i){try{const o=JSON.parse(t.slice(i,j+1));(Array.isArray(o)?o:[o]).forEach(x=>out.push(x))}catch(e){}}}
  return out.filter(b=>b&&(Array.isArray(b.extraits)||Array.isArray(b.groupe)))}
function findKid(gid,name){const n=norm(name);const K=kidsOf(gid);return K.find(c=>norm(c.name)===n)||K.find(c=>norm(c.name).startsWith(n)||n.startsWith(norm(c.name)))||K.find(c=>norm(c.name).split(" ")[0]===n.split(" ")[0])}
function importSheet(gid,d){const g=S.groups[gid];const pe=g.pendingExport;
  openSheet(`<h3>Importer la réponse de l'IA</h3>${pe?`<div class="notice">Après l'import, les <b>${pe.items.length} notes</b> exportées du ${fmtD(pe.date)} seront remplacées par les notes propres. Les originales restent gardées dans les notes du groupe.</div>`:""}
  <textarea class="field" id="iT" style="min-height:160px" placeholder="Collez ici la réponse de votre IA (le bloc Awacak)"></textarea><div class="row" style="margin-top:6px"><label class="btn small">📂 Ouvrir un fichier<input type="file" accept=".json,.txt" hidden id="iF"></label></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="iGo">Lire</button><button class="btn" id="iNo">Fermer</button></div><div id="iOut"></div>`,s=>{

      const NV={commence:1,envoie:2,"en voie":2,acquis:3};

      <div class="row" style="margin-top:10px"><button class="btn primary" id="iOk">Enregistrer</button></div>`;
      s.querySelector("#iOk").onclick=()=>{const on=[...s.querySelectorAll(".iK:checked")].map(x=>items[+x.value]);let n=0;const dates=new Set();
        on.forEach(it=>{dates.add(it.date);if(it.type==="g"){(g.notes=g.notes||[]).push({id:uid("gn"),date:it.date,text:it.texte,src:"ia"});n++;return}const c=it.c,x=it.x;const rid=x.repere&&REPI[x.repere]?x.repere:"";
          (c.notes=c.notes||[]).push({id:uid("n"),date:it.date,text:x.texte,rep:rid,dom:rid?REPI[rid].dom:(DOMS[x.domaine]?x.domaine:""),moment:MOM[x.moment]?x.moment:"",src:"ia"});n++;
          const lv=NV[x.niveau];if(rid&&lv)setLvl(c,rid,lv,it.date);
          (x.motscles||[]).forEach(k=>{if(k&&k.mot&&SPH[k.sphere])(c.kw=c.kw||[]).push({id:uid("k"),mot:k.mot,sph:k.sphere,t:k.type==="defi"?"defi":"force",date:it.date})});
          if(x.prochainpas&&!(c.pas||[]).some(p=>norm(p.text)===norm(x.prochainpas)))(c.pas=c.pas||[]).push({id:uid("p"),text:x.prochainpas,rep:rid,status:"cours",date:it.date})});
        if(pe&&dates.has(pe.date))removeExported(gid);
        save();closeSheet();render();toast(n+" notes enregistrées")}}})}
function removeExported(gid){const g=S.groups[gid];const pe=g.pendingExport;if(!pe)return;const ids=new Set(pe.items.map(i=>i.id));
  kidsOf(gid).forEach(c=>{c.notes=(c.notes||[]).filter(n=>!ids.has(n.id))});g.inbox=(g.inbox||[]).filter(q=>!ids.has(q.id));g.notes=(g.notes||[]).filter(n=>!ids.has(n.id));

/* ---------- Portrait périodique ---------- */
function periodLabel(){const d=new Date();const m=d.getMonth()+1,y=d.getFullYear();return m>=6?`novembre ${y}`:`mai ${y}`}
function portraitData(c){const out={};Object.entries(DOMS).forEach(([dk,D])=>{const obs=REP.filter(r=>r.dom===dk&&lvlOf(c,r.id)).map(r=>`${r.t} : ${LV[lvlOf(c,r.id)].toLowerCase()}`);const notes=(c.notes||[]).filter(n=>n.dom===dk).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25).map(n=>`${n.date} : ${n.text}`);out[dk]={obs,notes}});return out}
function portraitPrompt(c,per){const P=portraitData(c);const A=kwAgg(c);
  return `Rédige le portrait périodique (dossier éducatif, ministère de la Famille du Québec) de ${c.name}${c.dob?", "+ageLabel(c.dob):""}, pour la période de ${per}. Il couvre les 4 domaines : physique et moteur, cognitif, langagier, social et affectif.
Pour chaque domaine : 3 à 5 phrases simples pour les parents, positives, descriptives et respectueuses, qui soulignent les forces, les intérêts, les progrès et, s'il y a lieu, les défis présentés comme ce sur quoi on travaille. Pas de jargon, pas de diagnostic, rien d'inventé : utilise seulement les observations ci-dessous. Ajoute "suite" : 2 ou 3 prochains pas que nous allons offrir.
Réponds seulement en JSON : {"physique":"…","cognitif":"…","langagier":"…","social":"…","suite":"…"}
${c.interets?"\nIntérêts : "+c.interets:""}${c.langues?"\nLangues : "+c.langues:""}${c.famille?"\nÀ respecter (famille) : "+c.famille:""}
Forces (roue) : ${A.filter(x=>x.t==="force").map(x=>x.mot).join(", ")||"—"}
Défis (roue) : ${A.filter(x=>x.t==="defi").map(x=>x.mot).join(", ")||"—"}
Prochains pas actuels : ${(c.pas||[]).map(p=>p.text+" ("+(p.status==="fait"?"fait":"en cours")+")").join(" ; ")||"—"}

${Object.entries(DOMS).map(([dk,D])=>`${D.nom.toUpperCase()}\nRepères observés : ${P[dk].obs.join(" ; ")||"—"}\nNotes : ${P[dk].notes.join(" | ")||"—"}`).join("\n\n")}`}
function portraitSheet(cid){const c=S.children[cid];const per=periodLabel();c.portraits=c.portraits||{};const cur=c.portraits[per]||{};
  const F=[["physique","Physique et moteur"],["cognitif","Cognitif"],["langagier","Langagier"],["social","Social et affectif"],["suite","Pour la suite"]];
  if(!cur.suite&&(c.pas||[]).length)cur.suite=(c.pas||[]).filter(p=>p.status!=="fait").map(p=>p.text).join(" ; ");
  openSheet(`<h3>Portrait périodique · ${esc(c.name)}</h3><p class="small muted" style="margin:0">Période : ${per}. À compléter en novembre et en mai, à remettre aux parents au plus tard le 15 décembre et le 15 juin.</p>
  <div class="row" style="margin:10px 0"><button class="btn small" id="ppAI">1. Copier pour mon IA</button><button class="btn small" id="ppPaste">2. Coller la réponse</button></div><div id="ppIn"></div>
  ${F.map(([k,n])=>`<label class="f">${n}<textarea class="field" id="pp_${k}" style="min-height:110px">${esc(cur[k]||"")}</textarea></label>`).join("")}
  <label class="f">Rédigé par<input class="field" id="ppBy" value="${esc(cur.by||S.settings.me||"")}"></label><label class="f">Date<input type="date" class="field" id="ppD" value="${cur.date||todayISO()}"></label>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="ppSave">Enregistrer</button><button class="btn" id="ppDoc">Créer le document</button><button class="btn ghost" id="ppNo">Fermer</button></div>`,s=>{
    const grab=()=>{const o={};F.forEach(([k])=>o[k]=s.querySelector("#pp_"+k).value.trim());o.by=s.querySelector("#ppBy").value.trim();o.date=s.querySelector("#ppD").value;return o};
    s.querySelector("#ppNo").onclick=closeSheet;s.querySelector("#ppAI").onclick=()=>copyText(portraitPrompt(c,per),"Copié : collez dans votre IA");
    s.querySelector("#ppPaste").onclick=()=>{s.querySelector("#ppIn").innerHTML=`<textarea class="field" id="ppR" placeholder="Collez la réponse JSON de l'IA"></textarea><button class="btn small primary" id="ppFill" style="margin-top:6px">Remplir</button>`;s.querySelector("#ppFill").onclick=()=>{const t=s.querySelector("#ppR").value;const i=t.indexOf("{"),j=t.lastIndexOf("}");try{const o=JSON.parse(t.slice(i,j+1));F.forEach(([k])=>{if(o[k])s.querySelector("#pp_"+k).value=o[k]});s.querySelector("#ppIn").innerHTML="";toast("Textes remplis : relisez et ajustez")}catch(e){toast("Je ne comprends pas cette réponse.")}}};
    s.querySelector("#ppSave").onclick=()=>{c.portraits[per]=grab();save();toast("Portrait enregistré")};
    s.querySelector("#ppDoc").onclick=async()=>{c.portraits[per]=grab();save();const html=await portraitDoc(c,per,c.portraits[per]);download(`portrait-${norm(c.name).replace(/ /g,"-")}-${per.replace(/ /g,"-")}.html`,html,"text/html");toast("Document créé : ouvrez-le pour imprimer ou enregistrer en PDF")}})}
async function toDataURL(u){try{const r=await fetch(u);const b=await r.blob();return await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){return ""}}
async function portraitDoc(c,per,P){const E=esc;const ic={};for(const k of Object.keys(SPH))ic[k]=await toDataURL(`img/sph-${k}.webp`);const logo=await toDataURL("img/enfants.png");
  let wheel=wheelHTML(c).replace(/<img class="wi (\w)" src="img\/sph-(\w+)\.webp" alt="">/g,(m,p,k)=>`<img class="wi ${p}" src="${ic[k]}" alt="">`).replace(/ data-act="kwOpen"[^>]*?data-t="\w+"/g,"");
  const box=(t,v)=>`<section class="bx"><h2>${t}</h2><p>${E(v||"").replace(/\n/g,"<br>")||"<span class='m'>—</span>"}</p></section>`;
  return `<!DOCTYPE html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait périodique · ${E(c.name)}</title><style>
@page{size:Letter;margin:.6in}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2a2622;max-width:7.3in;margin:0 auto;padding:18px;line-height:1.5}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid #E0782F;padding-bottom:10px}header img{width:70px}h1{margin:0;font-size:22pt;color:#E0782F}.sub{margin:2px 0 0;color:#6a615a}
.id{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:14px 0;font-size:10.5pt}.bx{border:1px solid #EADFD3;border-left:5px solid #E0782F;border-radius:10px;padding:10px 14px;margin:12px 0;break-inside:avoid;background:#FFFBF6}.bx h2{margin:0 0 4px;font-size:13pt}.bx p{margin:0;font-size:11pt}.m{color:#999}
.wheelwrap{position:relative;width:4.6in;aspect-ratio:1;margin:10px auto}.wheelwrap svg{position:absolute;inset:0;width:100%;height:100%}.q{position:absolute;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;overflow:hidden}.qn{left:22%;right:22%;top:6%;height:24%}.qs{left:22%;right:22%;bottom:6%;height:24%}.qe{right:4%;top:30%;width:24%;height:40%}.qw{left:4%;top:30%;width:24%;height:40%}
.k{background:rgba(255,255,255,.94);border:0;border-radius:999px;padding:2px 8px;font:inherit;font-weight:700;color:#2a2622;line-height:1.2}.k.defi{outline:2px dashed #C9573F;outline-offset:-2px}.wc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;text-align:center;font-weight:700;font-size:10pt}.wi{position:absolute;width:9%;z-index:2}.wi.n{left:50%;top:30.5%;transform:translateX(-50%)}.wi.s{left:50%;bottom:30.5%;transform:translateX(-50%)}.wi.e{right:30.5%;top:50%;transform:translateY(-50%)}.wi.w{left:30.5%;top:50%;transform:translateY(-50%)}
.leg{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:9pt}.leg img{width:30px}.sig{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:10.5pt}.sig div{border-top:1px solid #999;padding-top:4px}.pb{break-before:page}
@media print{body{padding:0}}</style></head><body>
<header><img src="${logo}" alt=""><div><h1>Portrait périodique</h1><p class="sub">Dossier éducatif de l'enfant · ${E(per)}</p></div></header>
<div class="id"><div><b>Enfant :</b> ${E(c.name)}</div><div><b>Date de naissance :</b> ${c.dob?E(fmtD(c.dob,true)):"—"}</div><div><b>Rédigé par :</b> ${E(P.by||"")}</div><div><b>Date de rédaction :</b> ${P.date?E(fmtD(P.date,true)):"—"}</div></div>
${box("Physique et moteur",P.physique)}${box("Cognitif",P.cognitif)}${box("Langagier",P.langagier)}${box("Social et affectif",P.social)}${box("Pour la suite",P.suite)}
<div class="sig"><div>Signature de l'éducatrice</div><div>Date de remise au parent</div></div>
<section class="pb"><h2 style="color:#E0782F">Ses forces dans la roue de la médecine</h2>${wheel}<div class="leg">${Object.entries(SPH).map(([k,s])=>`<div><img src="${ic[k]}" alt=""><br><b>${s.nom}</b><br>${s.d}</div>`).join("")}</div></section>
</body></html>`}
/* ---------- Sauvegardes ---------- */
function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type||"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Copié")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg||"Copié")}catch(er){toast("Copie impossible")}ta.remove()}}
function backup(){S.meta.lastBackup=new Date().toISOString();save();download(`awacak-sauvegarde-${todayISO()}.json`,JSON.stringify({awacak:1,at:S.meta.lastBackup,data:S}));toast("Sauvegarde téléchargée")}
async function backupPhotos(){const keys=await keysP("photos");const out={};for(const k of keys){const b=await getP("photos",k);out[k]=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}download(`awacak-photos-${todayISO()}.json`,JSON.stringify({awacakPhotos:1,photos:out}));toast(keys.length+" photos sauvegardées")}
function mergeArr(a,b){const m=new Map();(a||[]).forEach(x=>m.set(x.id,x));(b||[]).forEach(x=>{if(x&&x.id&&!m.has(x.id))m.set(x.id,x)});return [...m.values()]}
function mergeKid(a,b){const o=Object.assign({},b,a);["notes","kw","pas","photos"].forEach(k=>o[k]=mergeArr(a[k],b[k]));o.obs=Object.assign({},b.obs||{});Object.entries(a.obs||{}).forEach(([r,L])=>{const M=new Map((o.obs[r]||[]).map(e=>[e.d,e]));L.forEach(e=>M.set(e.d,e));o.obs[r]=[...M.values()]});o.portraits=Object.assign({},b.portraits||{},a.portraits||{});return o}
function mergeGroup(a,b){const o=Object.assign({},b,a);o.inbox=mergeArr(a.inbox,b.inbox);o.notes=mergeArr(a.notes,b.notes);o.presences=Object.assign({},b.presences||{});Object.entries(a.presences||{}).forEach(([d,L])=>o.presences[d]=[...new Set([...(o.presences[d]||[]),...L])]);return o}
async function readJSONFile(f){try{return JSON.parse(await f.text())}catch(e){toast("Fichier illisible.");return null}}
async function importPhotos(o){let n=0;for(const [k,u] of Object.entries(o.photos||{})){try{const b=await (await fetch(u)).blob();await tx("photos","readwrite",st=>st.put(b,k));n++}catch(e){}}toast(n+" photos importées");render()}
async function onBackupFile(f,mode){const o=await readJSONFile(f);if(!o)return;if(o.awacakPhotos){await importPhotos(o);return}if(!o.awacak||!o.data){toast("Ce n'est pas une sauvegarde Awacak.");return}
  if(mode==="restore"){S=Object.assign({v:1,groups:{},children:{},settings:{me:"",ai:"claude",sph:{}},meta:{}},o.data);save();toast("Sauvegarde restaurée");location.hash="#accueil";render();return}
  const D=o.data;Object.entries(D.groups||{}).forEach(([k,g])=>S.groups[k]=S.groups[k]?mergeGroup(S.groups[k],g):g);Object.entries(D.children||{}).forEach(([k,c])=>S.children[k]=S.children[k]?mergeKid(S.children[k],c):c);save();render();toast("Sauvegarde fusionnée")}
/* ---------- Actions ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;const a=b.dataset.act,id=b.dataset.id;const c=S.children[id];
  if(a==="addGroup"){const n=$("#newG").value.trim();if(!n){toast("Donnez un nom au groupe.");return}const g={id:uid("g"),name:n,presences:{},inbox:[],notes:[]};S.groups[g.id]=g;save();location.hash="#g-"+g.id}
  else if(a==="addKids"){const L=$("#newKids").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!L.length)return;L.forEach((n,i)=>{const k={id:uid("c"),groupId:id,name:n,dob:"",avatar:AVATARS[(Object.keys(S.children).length+i)%AVATARS.length],obs:{},notes:[],kw:[],pas:[],photos:[]};S.children[k.id]=k});save();render();toast(L.length+" enfant(s) ajouté(s)")}
  else if(a==="pres"){const kid=S.children[id];const g=S.groups[kid.groupId];g.presences=g.presences||{};const L=g.presences[U.date]=g.presences[U.date]||[];const i=L.indexOf(id);i>=0?L.splice(i,1):L.push(id);save();render()}
  else if(a==="groupEdit")groupEditSheet(id);else if(a==="kidEdit")kidEditSheet(id);
  else if(a==="sub"){U.sub[b.dataset.d]=b.dataset.s;render()}else if(a==="band"){U.band[b.dataset.k]=+b.dataset.b;render()}
  else if(a==="lv"){const l=+b.dataset.l;const now=lvlOn(c,b.dataset.r,U.date);setLvl(c,b.dataset.r,now===l?0:l,U.date);save();render()}
  else if(a==="noteRep")noteSheet(id,b.dataset.r);else if(a==="noteAdd")noteSheet(id,"");
  else if(a==="noteDel"){c.notes=c.notes.filter(n=>n.id!==b.dataset.n);save();render()}
  else if(a==="pasFromRep"){const r=REPI[b.dataset.r];const t="Offrir : "+r.a.split(",")[0].trim().replace(/^./,x=>x.toLowerCase());(c.pas=c.pas||[]).push({id:uid("p"),text:t,rep:r.id,status:"cours",date:U.date});save();toast("Prochain pas ajouté (modifiable dans le Portrait)");render()}
  else if(a==="pasAdd"){const t=$("#pasT").value.trim();if(!t)return;(c.pas=c.pas||[]).push({id:uid("p"),text:t,rep:"",status:"cours",date:U.date});save();render()}
  else if(a==="pasSug"){(c.pas=c.pas||[]).push({id:uid("p"),text:b.dataset.t,rep:b.dataset.r||"",status:"cours",date:U.date});save();render()}
  else if(a==="pasSt"){const p=c.pas.find(x=>x.id===b.dataset.p);p.status=p.status==="fait"?"cours":"fait";p.doneDate=p.status==="fait"?U.date:"";save();render()}
  else if(a==="pasDel"){c.pas=c.pas.filter(x=>x.id!==b.dataset.p);save();render()}else if(a==="pasNote")pasNoteSheet(id,b.dataset.p);
  else if(a==="kwAdd"){const m=$("#kwM").value.trim();if(!m)return;(c.kw=c.kw||[]).push({id:uid("k"),mot:m,sph:$("#kwS").value,t:$("#kwT").value,date:U.date});save();render()}
  else if(a==="kwOpen")kwSheet(id,b.dataset.m,b.dataset.s,b.dataset.t);
  else if(a==="photoView")photoViewSheet(id,b.dataset.p);
  else if(a==="portraitP")portraitSheet(id);
  else if(a==="notesMenu")notesMenu(id);else if(a==="qSort")qSortSheet(id,b.dataset.q);
  else if(a==="qDel"){const g=S.groups[id];g.inbox=g.inbox.filter(x=>x.id!==b.dataset.q);save();render()}
  else if(a==="backup")backup();else if(a==="backupPh")backupPhotos()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="uDate"){U.date=t.value||todayISO();render()}
  else if(t.dataset.act==="photoAdd"&&t.files[0])addPhoto(t.dataset.id,t.files[0]);
  else if(t.dataset.act==="mergeFile"&&t.files[0])onBackupFile(t.files[0],"merge");
  else if(t.dataset.act==="restoreFile"&&t.files[0]){if(confirm("Remplacer toutes les données de cet appareil par cette sauvegarde ?"))onBackupFile(t.files[0],"restore")}
  else if(t.id==="setMe"){S.settings.me=t.value.trim();save()}else if(t.id==="setAI"){S.settings.ai=t.value;save()}
  else if(t.dataset.sphr){S.settings.sph=S.settings.sph||{};const r=REPI[t.dataset.sphr];if(t.value===r.sph0)delete S.settings.sph[r.id];else S.settings.sph[r.id]=t.value;save();toast("Sphère modifiée")}});
$("#fab").onclick=()=>{const r=route();const g=r.v==="group"?r.gid:r.v==="child"&&S.children[r.cid]?S.children[r.cid].groupId:null;if(g)quickNote(g,r.v==="child"?r.cid:null)};
/* ---------- Démarrage ---------- */
(async()=>{try{db=await idb();const st=await getP("state","main");if(st)S=Object.assign(S,st);S.settings=Object.assign({me:"",ai:"claude",sph:{}},S.settings||{})}catch(e){toast("Stockage indisponible sur ce navigateur.")}
  render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
</body>
</html>
